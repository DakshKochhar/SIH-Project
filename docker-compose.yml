version: "3.9"

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nammaflood
      POSTGRES_USER: nammaflood
      POSTGRES_PASSWORD: nammaflood
    ports:
      - "5432:5432"
    volumes:
      - nammaflood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nammaflood"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://nammaflood:nammaflood@postgis:5432/nammaflood
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data

volumes:
  nammaflood_pgdata:
